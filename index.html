    <!-- Lazy Video Loading -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const phoneVideos = document.querySelectorAll('.hero_phone-video');
            const watchVideos = document.querySelectorAll('.hero_watch-video');

            console.log(`Found ${phoneVideos.length} phone videos, ${watchVideos.length} watch videos`);

            // Group them into pairs
            const pairs = [];
            const maxLength = Math.max(phoneVideos.length, watchVideos.length);
            for (let i = 0; i < maxLength; i++) {
                const pair = [];
                if (phoneVideos[i]) pair.push(phoneVideos[i]);
                if (watchVideos[i]) pair.push(watchVideos[i]);
                pairs.push(pair);
            }

            console.log(`Created ${pairs.length} pairs`);

            // Reset all videos
            [...phoneVideos, ...watchVideos].forEach((video) => {
                video.loop = false;
                video.preload = 'auto';
                video.pause();
                video.currentTime = 0;
            });

            let currentIndex = 0;

            function playNext() {
                const pair = pairs[currentIndex];
                console.log(
                    `Playing pair ${currentIndex}:`,
                    pair.map((v) => v.className),
                );

                // Track how many videos in this pair have finished
                let finishedCount = 0;

                pair.forEach((video) => {
                    video.removeEventListener('timeupdate', video._checkEnded);
                    video.pause();
                    video.currentTime = 0;

                    // Each video gets its own checkEnded listener
                    video._checkEnded = function() {
                        if (video.duration - video.currentTime < 0.3) {
                            video.removeEventListener('timeupdate', video._checkEnded);
                            video.pause();
                            finishedCount++;

                            console.log(`  ${video.className} finished (${finishedCount}/${pair.length})`);

                            // Only advance when ALL videos in the pair are done
                            if (finishedCount >= pair.length) {
                                currentIndex = (currentIndex + 1) % pairs.length;
                                playNext();
                            }
                        }
                    };

                    function startPlayback() {
                        video.addEventListener('timeupdate', video._checkEnded);
                        const playPromise = video.play();
                        if (playPromise !== undefined) {
                            playPromise.then(() => console.log(`  ${video.className} playing`)).catch((err) => console.error(`  ${video.className} failed:`, err));
                        }
                    }

                    if (video.readyState >= 3) {
                        startPlayback();
                    } else {
                        console.log(`  Waiting for ${video.className} to load...`);
                        video.load();
                        video.addEventListener('canplay', () => startPlayback(), {
                            once: true
                        });
                    }
                });
            }

            if (pairs.length > 0) playNext();

            // LAZY VIDEO START

            var lazyVideos = [].slice.call(document.querySelectorAll('video.lazy'));

            if ('IntersectionObserver' in window) {
                var lazyVideoObserver = new IntersectionObserver(function(entries, observer) {
                    entries.forEach(function(video) {
                        if (video.isIntersecting) {
                            for (var source in video.target.children) {
                                var videoSource = video.target.children[source];
                                if (typeof videoSource.tagName === 'string' && videoSource.tagName === 'SOURCE') {
                                    videoSource.src = videoSource.dataset.src;
                                }
                            }

                            video.target.load();
                            video.target.classList.remove('lazy');
                            lazyVideoObserver.unobserve(video.target);
                        }
                    });
                });

                lazyVideos.forEach(function(lazyVideo) {
                    lazyVideoObserver.observe(lazyVideo);
                });
            }
        });
    </script>

                opacity: 0,
                webkitMask: 'radial-gradient(circle 0rem at 0% 0%, black 0%, transparent 0%)',
                mask: 'radial-gradient(circle 0rem at 0% 0%, black 0%, transparent 0%)',
            });

            container.addEventListener('mousemove', (e) => {
                const rect = container.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;

                gsap.to(dotsEl, {
                    webkitMask: `radial-gradient(circle 18.75rem at ${x}% ${y}%, black 0%, transparent 100%)`,
                    mask: `radial-gradient(circle 18.75rem at ${x}% ${y}%, black 0%, transparent 100%)`,
                    duration: 1.2,
                    ease: 'power4.out',
                    opacity: 1,
                });
            });

            container.addEventListener('mouseleave', () => {
                gsap.to(dotsEl, {
                    opacity: 0,
                    duration: 0.6,
                    ease: 'power2.out',
                });
            });
        });
    </script>
    <script>
        let mm = gsap.matchMedia();

        mm.add("(max-width: 479px)", () => {

            gsap.set(".banner", {
                yPercent: 300,
                display: "flex"
            });

            let heroInView = true;
            // Prevent false triggers on iOS page load
            let userHasScrolled = false;

            // Wait for a real scroll event before enabling direction logic
            const onFirstScroll = () => {
                userHasScrolled = true;
                window.removeEventListener("scroll", onFirstScroll);
            };
            // Use a short delay so iOS initial layout shifts don't count
            setTimeout(() => {
                window.addEventListener("scroll", onFirstScroll, {
                    passive: true
                });
            }, 500);

            ScrollTrigger.create({
                trigger: ".hero_section",
                start: "top bottom",
                end: "bottom top",
                onEnter: () => {
                    heroInView = true;
                    gsap.to(".banner", {
                        yPercent: 300,
                        duration: 0.3,
                        ease: "power2.out"
                    });
                },
                onEnterBack: () => {
                    heroInView = true;
                    gsap.to(".banner", {
                        yPercent: 300,
                        duration: 0.3,
                        ease: "power2.out"
                    });
                },
                onLeave: () => {
                    heroInView = false;
                },
            });

            ScrollTrigger.create({
                trigger: ".hero_section",
                start: "bottom top",
                endTrigger: "body",
                end: "bottom top",
                onUpdate: (self) => {
                    if (!userHasScrolled || heroInView) return;

                    if (self.direction === -1) {
                        gsap.to(".banner", {
                            yPercent: 0,
                            duration: 0.3,
                            ease: "power2.out"
                        });
                    } else {
                        gsap.to(".banner", {
                            yPercent: 300,
                            duration: 0.3,
                            ease: "power2.out"
                        });
                    }
                },
            });

        });

    <script>
        // ============================================================
        // VIDEO TABS — Lazy-loading, auto-advancing, scroll-to-active
        // Dependencies: GSAP (core only, no plugins needed)
        // ============================================================

        ;
        (function() {
            "use strict";

            console.log('[VideoTabs] Script loaded');

            window.addEventListener('load', function() {
                console.log('[VideoTabs] Window loaded');

                // --- CONFIG ---
                const ACTIVE_CLASS = 'is-active';

                // --- STATE ---
                let currentIndex = -1; // nothing active yet
                let ringTween = null;
                let isHovering = false;
                let isInView = false;
                let hasStarted = false; // first activation hasn't happened yet

                // --- DOM DISCOVERY ---
                const wrapper = document.querySelector('[data-tabs-wrapper]');
                if (!wrapper) {
                    console.warn('[VideoTabs] No [data-tabs-wrapper] found');
                    return;
                }

                const tabs = [...wrapper.querySelectorAll('[data-tab]')];

                // Media panels may be outside wrapper
                let mediaPanels = [...wrapper.querySelectorAll('[data-tab-media]')];
                if (mediaPanels.length === 0) {
                    mediaPanels = [...document.querySelectorAll('[data-tab-media]')];
                }

                const scrollContainer = document.querySelector('.extra-features_list');
                const totalTabs = tabs.length;

                console.log('[VideoTabs] Tabs:', tabs.length, '| Media panels:', mediaPanels.length);

                // --- PER-TAB RINGS + PAUSE ICONS ---
                const rings = tabs.map(tab => {
                    return tab.querySelector('[data-tabs-ring] circle:last-child') || null;
                });
                const pauseIcons = tabs.map(tab => tab.querySelector('[data-tabs-pause]'));

                let circumference = 0;
                rings.forEach((ring, i) => {
                    if (!ring || ring.tagName !== 'circle') return;
                    const c = 2 * Math.PI * parseFloat(ring.getAttribute('r'));
                    if (i === 0) circumference = c;
                    ring.style.strokeDasharray = c;
                    ring.style.strokeDashoffset = c;
                    ring.style.transformOrigin = 'center';
                    ring.style.transform = 'rotate(-90deg)';
                });

                pauseIcons.forEach(icon => {
                    if (icon) icon.style.opacity = '0';
                });

                // --- VIDEO HELPERS ---
                // Get the <video> element inside a media panel
                function getVideo(index) {
                    const panel = mediaPanels[index];
                    if (!panel) return null;
                    return panel.querySelector('video');
                }

                // Inject <source> from data-src and start loading
                function loadVideo(index) {
                    const video = getVideo(index);
                    if (!video) return;

                    // Ensure autoplay-friendly attributes are set before play()
                    video.muted = true;
                    video.playsInline = true;

                    const src = video.getAttribute('data-src');
                    if (!src) {
                        console.warn(`[VideoTabs] No data-src on video ${index}`);
                        return;
                    }

                    // Clear any existing sources
                    video.innerHTML = '';

                    // Create and inject new source
                    const source = document.createElement('source');
                    source.src = src;
                    source.type = 'video/mp4';
                    video.appendChild(source);

                    video.load();
                    console.log(`[VideoTabs] Loaded source for video ${index}`);
                }

                // Strip <source> and reset — frees memory, stops decoding
                function unloadVideo(index) {
                    const video = getVideo(index);
                    if (!video) return;

                    video.pause();
                    video.removeAttribute('src');
                    video.innerHTML = ''; // remove all <source> tags
                    video.load(); // forces browser to release the buffer
                    console.log(`[VideoTabs] Unloaded video ${index}`);
                }

                // --- RING ANIMATION ---
                function startRing(index, duration) {
                    if (ringTween) ringTween.kill();

                    // Reset all rings to empty
                    rings.forEach(r => {
                        if (r && r.tagName === 'circle') {
                            gsap.set(r, {
                                strokeDashoffset: circumference
                            });
                        }
                    });

                    const ring = rings[index];
                    if (!ring || ring.tagName !== 'circle' || !circumference) return;

                    console.log(`[VideoTabs] Ring ${index}: ${duration}s`);
                    ringTween = gsap.fromTo(
                        ring, {
                            strokeDashoffset: circumference
                        }, {
                            strokeDashoffset: 0,
                            duration: duration,
                            ease: 'none'
                        }
                    );
                }

                // --- SCROLL TO ACTIVE TAB ---
                function scrollToTab(index) {
                    const tab = tabs[index];
                    if (!tab || !scrollContainer) return;

                    tab.scrollIntoView({
                        behavior: 'smooth',
                        block: 'nearest',
                        inline: 'nearest'
                    });
                }

                // --- ACTIVATE TAB ---
                function activateTab(index) {
                    const prevIndex = currentIndex;
                    console.log(`[VideoTabs] ▶ activateTab(${index}) (prev: ${prevIndex})`);
                    currentIndex = index;

                    // Toggle active class
                    tabs.forEach((tab, i) => tab.classList.toggle(ACTIVE_CLASS, i === index));

                    // Show/hide media panels
                    mediaPanels.forEach((panel, i) => {
                        panel.style.display = i === index ? '' : 'none';
                    });

                    // Reset all pause icons
                    pauseIcons.forEach(icon => {
                        if (icon) icon.style.opacity = '0';
                    });

                    // Unload previous video
                    if (prevIndex >= 0 && prevIndex !== index) {
                        unloadVideo(prevIndex);
                    }

                    // Load + play new video
                    const video = getVideo(index);
                    if (!video) {
                        console.error(`[VideoTabs] No <video> at index ${index}`);
                        return;
                    }

                    function attemptPlay(retries) {
                        video.muted = true;
                        const playPromise = video.play();
                        if (playPromise) {
                            playPromise
                                .then(() => {
                                    console.log(`[VideoTabs] Video ${index} playing`);
                                    startRing(index, video.duration);
                                })
                                .catch(err => {
                                    console.warn(`[VideoTabs] play() attempt failed (${retries} retries left):`, err.message);
                                    if (retries > 0) {
                                        setTimeout(() => attemptPlay(retries - 1), 200);
                                    }
                                });
                        }
                    }

                    function onReady() {
                        console.log(`[VideoTabs] Video ${index} ready — duration: ${video.duration}s, readyState: ${video.readyState}`);
                        attemptPlay(5);
                    }

                    // Safari needs canplay (has buffered frames), not just loadedmetadata
                    // Also set webkit-playsinline for older iOS Safari
                    video.setAttribute('webkit-playsinline', '');
                    video.setAttribute('playsinline', '');

                    // Listen for canplay, but also check if already ready (race condition)
                    if (video.readyState >= 3) {
                        onReady();
                    } else {
                        video.addEventListener('canplay', onReady, {
                            once: true
                        });
                    }

                    loadVideo(index);

                    // Scroll the tab list to the active tab
                    scrollToTab(index);
                }

                // --- VIDEO ENDED → ADVANCE ---
                // Use capture phase since "ended" doesn't bubble
                mediaPanels.forEach((panel, i) => {
                    panel.addEventListener('ended', (e) => {
                        if (e.target.tagName !== 'VIDEO') return;
                        if (i !== currentIndex) return;
                        console.log(`[VideoTabs] Video ${i} ended → advancing`);
                        activateTab((currentIndex + 1) % totalTabs);
                    }, true);
                });

                // --- HOVER PAUSE / RESUME ---
                wrapper.addEventListener('mouseenter', () => {
                    isHovering = true;
                    if (!isInView) return;
                    const v = getVideo(currentIndex);
                    if (v) v.pause();
                    if (ringTween) ringTween.pause();
                    const icon = pauseIcons[currentIndex];
                    if (icon) icon.style.opacity = '1';
                });

                wrapper.addEventListener('mouseleave', () => {
                    isHovering = false;
                    if (!isInView) return;
                    const v = getVideo(currentIndex);
                    if (v) v.play();
                    if (ringTween) ringTween.resume();
                    const icon = pauseIcons[currentIndex];
                    if (icon) icon.style.opacity = '0';
                });

                // --- MANUAL TAB CLICKS ---
                tabs.forEach((tab) => {
                    tab.addEventListener('click', () => {
                        const clickedIndex = parseInt(tab.getAttribute('data-tab'), 10);
                        console.log(`[VideoTabs] Tab clicked: ${clickedIndex}`);
                        if (clickedIndex === currentIndex) return;
                        if (ringTween) ringTween.kill();
                        activateTab(clickedIndex);
                    });
                });

                // --- VISIBILITY OBSERVER ---
                // Only play when the component is in the viewport.
                // Pause video + ring when scrolled out, resume when scrolled back.
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            isInView = true;
                            console.log('[VideoTabs] In view');

                            if (!hasStarted) {
                                // First time entering view — kick everything off
                                hasStarted = true;
                                activateTab(0);
                            } else if (!isHovering) {
                                // Returning to view — resume current video
                                const v = getVideo(currentIndex);
                                if (v) v.play();
                                if (ringTween) ringTween.resume();
                            }
                        } else {
                            isInView = false;
                            console.log('[VideoTabs] Out of view');

                            // Pause current video + ring
                            if (currentIndex >= 0) {
                                const v = getVideo(currentIndex);
                                if (v) v.pause();
                                if (ringTween) ringTween.pause();
                            }
                        }
                    });
                }, {
                    threshold: 0.2
                }); // triggers when 20% of wrapper is visible

                observer.observe(wrapper);

                console.log('[VideoTabs] Init complete — waiting for scroll into view ✓');
            });
        })();
    </script>

    <script>
        (function() {
            // Guard: bail if GSAP core isn't present
            if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') {
                console.warn('[shutter/dots] GSAP or ScrollTrigger not loaded');
                return;
            }

            /* ============================================================
             Shutter Scroll Transition
             ============================================================ */
            function initShutterScrollTransition() {
                // Defaults — override per-instance via data-attributes
                const defaultRows = 6;
                const defaultMode = 'cover';
                const defaultScrollStart = {
                    cover: 'bottom bottom',
                    reveal: 'top bottom'
                };
                const defaultScrollEnd = {
                    cover: 'bottom 20%',
                    reveal: 'top center'
                };
                const defaultScrub = 0.3;
                const defaultShutterDuration = 0.1;
                const defaultStaggerAmount = 0.01;

                const panelClass = 'shutter-scroll-transition__panel';
                const rowClass = 'shutter-scroll-transition__row';

                const breakpoints = {
                    mobile: '(max-width: 478px)',
                    landscape: '(max-width: 767px)',
                    tablet: '(max-width: 991px)',
                };

                const instances = [];

                const getMode = (wrapper) => (wrapper.dataset.mode === 'reveal' ? 'reveal' : defaultMode);

                function getRows(wrapper) {
                    const base = parseInt(wrapper.dataset.rows, 10) || defaultRows;
                    if (window.matchMedia(breakpoints.mobile).matches) {
                        return parseInt(wrapper.dataset.rowsMobile, 10) || base;
                    }
                    if (window.matchMedia(breakpoints.landscape).matches) {
                        return parseInt(wrapper.dataset.rowsLandscape, 10) || base;
                    }
                    if (window.matchMedia(breakpoints.tablet).matches) {
                        return parseInt(wrapper.dataset.rowsTablet, 10) || base;
                    }
                    return base;
                }

                const getScrollStart = (wrapper, mode) => wrapper.dataset.scrollStart || defaultScrollStart[mode];
                const getScrollEnd = (wrapper, mode) => wrapper.dataset.scrollEnd || defaultScrollEnd[mode];

                function buildPanel(wrapper, rows) {
                    const panel = document.createElement('div');
                    panel.classList.add(panelClass);
                    panel.setAttribute('data-shutter-scroll-panel', '');

                    const fragment = document.createDocumentFragment();
                    for (let r = 0; r < rows; r++) {
                        const row = document.createElement('div');
                        row.classList.add(rowClass);
                        row.setAttribute('data-shutter-scroll-row', '');
                        fragment.appendChild(row);
                    }
                    panel.appendChild(fragment);
                    wrapper.appendChild(panel);
                    return panel;
                }

                function createAnimation(wrapper, rows, section, mode) {
                    const fromScale = mode === 'cover' ? 0 : 1;
                    const toScale = mode === 'cover' ? 1 : 0;
                    const origin = mode === 'cover' ? 'bottom center' : 'top center';

                    gsap.set(rows, {
                        scaleY: fromScale,
                        transformOrigin: origin
                    });

                    const tl = gsap.timeline({
                        scrollTrigger: {
                            trigger: section,
                            start: getScrollStart(wrapper, mode),
                            end: getScrollEnd(wrapper, mode),
                            scrub: defaultScrub,
                            invalidateOnRefresh: true,
                        },
                    });

                    tl.to(rows, {
                        scaleY: toScale,
                        duration: defaultShutterDuration,
                        stagger: {
                            each: defaultStaggerAmount,
                            from: 'end'
                        },
                        ease: 'none',
                    });

                    return tl;
                }

                function setupInstance(wrapper) {
                    const section = wrapper.closest('section') || wrapper.parentElement;
                    if (!section) return null;

                    const rows = getRows(wrapper);
                    const mode = getMode(wrapper);
                    const panel = buildPanel(wrapper, rows);
                    const rowList = Array.from(panel.children);
                    const tl = createAnimation(wrapper, rowList, section, mode);

                    return {
                        wrapper,
                        tl
                    };
                }

                function destroyInstance(instance) {
                    instance.tl ? .scrollTrigger ? .kill();
                    instance.tl ? .kill();
                    const panel = instance.wrapper.querySelector('[data-shutter-scroll-panel]');
                    if (panel) panel.remove();
                }

                function buildAll() {
                    destroyAll();
                    document.querySelectorAll('[data-shutter-scroll-transition]').forEach((wrapper) => {
                        const inst = setupInstance(wrapper);
                        if (inst) instances.push(inst);
                    });
                    ScrollTrigger.refresh();
                }

                function destroyAll() {
                    instances.forEach(destroyInstance);
                    instances.length = 0;
                }

                const wrappers = document.querySelectorAll('[data-shutter-scroll-transition]');
                if (!wrappers.length) return;

                const mm = gsap.matchMedia();
                mm.add({
                        isDesktop: '(min-width: 992px)',
                        isTablet: '(min-width: 768px) and (max-width: 991px)',
                        isLandscape: '(min-width: 479px) and (max-width: 767px)',
                        isMobile: '(max-width: 478px)',
                        reduceMotion: '(prefers-reduced-motion: reduce)',
                    },
                    (context) => {
                        if (context.conditions.reduceMotion) return;
                        buildAll();
                        return () => destroyAll();
                    },
                );
            }

            // Play and pause video when scrolled away
            function initPlayPauseVideoScroll() {
                const videos = gsap.utils.toArray('[data-video="playpause"]');

                videos.forEach((el) => {
                    const video = el.querySelector('video');
                    if (!video) return;

                    ScrollTrigger.create({
                        trigger: el,
                        start: '0% 100%',
                        end: '100% 0%',
                        onEnter: () => video.play(),
                        onEnterBack: () => video.play(),
                        onLeave: () => video.pause(),
                        onLeaveBack: () => video.pause(),
                    });
                });
            }

            document.addEventListener('DOMContentLoaded', () => {
                initShutterScrollTransition();
                initPlayPauseVideoScroll();
            });
        })();
    </script>
